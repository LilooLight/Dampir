<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скиталец · Тёмные времена — настольный помощник</title>
  
  <!-- Подключаем шрифты Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  
  <!-- Подключаем внешние стили -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  
  <!-- ===== ШАПКА ===== -->
  <header class="site-head">
    <svg class="emblem" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M32 3 57 32 32 61 7 32Z"/>
        <path d="M32 17v29"/>
        <path d="M23 27h18"/>
      </g>
      <path d="M32 10l4 7h-8z" fill="currentColor"/>
      <circle cx="32" cy="49" r="2" fill="currentColor"/>
    </svg>
    <div>
      <h1>Скиталец</h1>
      <p class="sub">Тёмные времена · настольный помощник мастера и отряда</p>
    </div>
    <button class="help-btn" id="helpBtn">?</button>
  </header>

  <div class="rule-orn"><span class="diam" data-diamond></span></div>

  <!-- ===== НАВИГАЦИЯ ПО ВКЛАДКАМ ===== -->
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="sheet">Лист персонажа</button>
    <button class="tab" data-tab="ref">Справочник</button>
    <button class="tab" data-tab="xp">Трекер опыта</button>
  </nav>

  <!-- ===== ВКЛАДКА 1: ЛИСТ ПЕРСОНАЖА ===== -->
  <section id="panel-sheet" class="tab-panel">
    <div class="char-manager" id="charManager">
      <select id="charSelect" aria-label="Выбор персонажа"></select>
      <button class="btn gold" id="charNew">+ Создать</button>
      <button class="btn danger" id="charDelete">✕ Удалить</button>
      <button class="btn" id="charExport">Экспорт JSON</button>
      <button class="btn" id="charImport">Импорт JSON</button>
      <input type="file" id="charImportFile" accept=".json" hidden>
      <button class="btn danger" id="charReset">Сбросить всё</button>
    </div>
    <div id="sheetContainer"></div>
  </section>

  <!-- ===== ВКЛАДКА 2: СПРАВОЧНИК ===== -->
  <section id="panel-ref" class="tab-panel hidden">
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="10.5" cy="10.5" r="6"/>
          <line x1="15" y1="15" x2="20" y2="20"/>
        </svg>
        <input type="text" id="refSearch" placeholder="Поиск по названию и описанию…">
      </div>
      <select id="refCat" aria-label="Фильтр по категориям">
        <option value="all">Все категории</option>
      </select>
    </div>
    <div id="refList"></div>
  </section>

  <!-- ===== ВКЛАДКА 3: ТРЕКЕР ОПЫТА ===== -->
  <section id="panel-xp" class="tab-panel hidden">
    <div class="toolbar">
      <form id="charForm" style="display:flex;gap:.7rem;flex:1;flex-wrap:wrap;">
        <input type="text" id="charNameInput" placeholder="Имя нового скитальца…" maxlength="40">
        <button class="btn gold" type="submit">Принять в отряд</button>
      </form>
      <div>
        <button class="btn" id="exportBtn">Экспорт JSON</button>
        <button class="btn" id="importBtn">Импорт JSON</button>
        <button class="btn danger" id="resetBtn">Сбросить данные</button>
        <input type="file" id="importFile" accept=".json" hidden>
      </div>
    </div>

    <h2 class="sec-title"><span class="diam" data-diamond></span>Отряд</h2>
    <div id="charList" class="char-list"></div>

    <h2 class="sec-title">
      <span class="diam" data-diamond></span>Летопись опыта
      <span class="side">
        <span class="log-count" id="logCount"></span>
        <select id="logCharFilter" aria-label="Фильтр летописи по персонажу"></select>
      </span>
    </h2>
    <div id="logWrap"></div>
  </section>

  <!-- ===== ПОДВАЛ ===== -->
  <footer>Все данные хранятся только в вашем браузере — мастер может спать спокойно.</footer>
</div>

<!-- ===== МОДАЛЬНОЕ ОКНО (общее) ===== -->
<div class="overlay hidden" id="overlay">
  <div class="modal" role="dialog">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" id="modalClose">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <line x1="6" y1="6" x2="18" y2="18"/>
          <line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ===== КОНТЕЙНЕР ДЛЯ ТОСТОВ ===== -->
<div class="toasts" id="toasts"></div>

<!-- ===== ПОДКЛЮЧАЕМ ВНЕШНИЙ СКРИПТ ===== -->
<script src="app.js"></script>

</body>
</html>
