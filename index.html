<!DOCTYPE html>
<html lang="ru" data-t="d">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скиталец · Ожившие кошмары — летопись странника</title>
<script>try{if(localStorage.getItem('skit_theme')==='l')document.documentElement.setAttribute('data-t','l')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=Cormorant:ital,wght@0,500;0,600;1,500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles-a.css">
<link rel="stylesheet" href="styles-b.css">
<link rel="stylesheet" href="styles-c.css">
<style>.theme-btn{margin-left:2px}</style>
</head>
<body>
<div id="app">
  <header class="masthead">
    <div class="brand">
      <svg class="sigil" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="20" cy="20" r="13"/><path d="M20 7v-4M20 37v-4M33 20h4M3 20h4" stroke-linecap="round"/>
        <path d="M20 12l2.6 5.4 6 .8-4.4 4.2 1.1 5.9-5.3-2.9-5.3 2.9 1.1-5.9-4.4-4.2 6-.8z" fill="currentColor" stroke="none" opacity=".85"/>
      </svg>
      <div>
        <h1>Скиталец</h1>
        <span class="sub">Ожившие кошмары · летопись странника</span>
      </div>
    </div>
    <div class="prof-line">
      <span>Играет</span>
      <select id="profSel" title="Профиль игрока — фильтр списка персонажей"></select>
      <button class="ibtn" id="profBtn" data-act="prof-open" title="Игроки: добавить, переименовать, убрать" aria-label="Игроки"></button>
      <button class="ibtn theme-btn" id="themeBtn" data-act="theme" title="Светлая и тёмная тема" aria-label="Сменить тему"></button>
    </div>
  </header>

  <div class="gbar">
    <div class="gsearch" id="gsearch">
      <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></svg>
      <input type="text" id="gq" placeholder="Сквозной поиск: попадание, КУ, урон, провал, тварь…  ( / )" autocomplete="off">
      <kbd>/</kbd>
      <div class="gdrop" id="gdrop" hidden></div>
    </div>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <section id="view-sheet" class="view"></section>
  <section id="view-codex" class="view" hidden></section>
  <section id="view-xp" class="view" hidden></section>
  <section id="view-gm" class="view" hidden></section>
  <section id="view-help" class="view" hidden></section>

  <footer class="foot">
    <span>Летопись хранится в этом браузере — берегите её, как берегут огонь.</span>
    <span class="btns">
      <button class="link-btn" data-act="export">Экспорт летописи</button>
      <button class="link-btn" data-act="import">Импорт из JSON</button>
      <button class="link-btn" data-act="reset" id="resetBtn">Стереть летопись</button>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
    </span>
  </footer>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="data-a.js"></script>
<script src="data-b.js"></script>
<script src="data-c.js"></script>
<script src="data-d.js"></script>
<script src="app-a.js"></script>
<script src="app-b.js"></script>
<script src="app-c.js"></script>
<script src="app-d.js"></script>
<script src="app-e.js"></script>
<script>
window.addEventListener('load',function(){
  var need=['data-a','data-b','data-c','data-d','app-a','app-b','app-c','app-d','app-e'];
  var got=window.__skit||[];
  var miss=need.filter(function(n){return got.indexOf(n)<0});
  if(!miss.length)return;
  var m=document.createElement('div');
  m.className='errbox';
  m.innerHTML='<b>Не все файлы на месте.</b><br>Отсутствуют: <b>'+
    miss.map(function(n){return n+'.js'}).join(', ')+
    '</b><br>Все файлы должны лежать в одной папке с index.html (корень репозитория Dampir). Обновите страницу (Ctrl+F5).';
  document.getElementById('app').appendChild(m);
});
</script>
</body>
</html>
