<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скиталец · Тёмные времена — настольный помощник</title>
<!-- Шрифты: Cinzel для заголовков, EB Garamond для текста -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ============ Основа ============ */
:root{
  --bg:#1a1a1a;            /* основной фон */
  --bg-deep:#141311;       /* поля ввода, углубления */
  --panel:#201d18;         /* карточки и панели */
  --panel-2:#26221b;       /* шапки таблиц, hover строк */
  --line:#3a3327;          /* основные линии */
  --line-soft:#2b2620;     /* тонкие линии */
  --ink:#e0d5c1;           /* основной текст */
  --ink-dim:#a89a82;       /* приглушённый текст */
  --ink-faint:#6f6553;     /* почти незаметный текст */
  --blood:#8b0000;         /* тёмно-красный акцент */
  --blood-bright:#c03a2e;  /* красный для отрицательного */
  --gold:#c9a050;          /* золотой акцент */
  --gold-dim:#8a7038;      /* приглушённое золото */
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'EB Garamond',serif;
  font-size:18px;
  line-height:1.55;
  min-height:100vh;
}
/* Лёгкая световая виньетка — атмосфера свечи по краям экрана */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse at 50% 18%, transparent 55%, rgba(0,0,0,.42) 100%);
}
::selection{background:rgba(139,0,0,.45);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#151312}
::-webkit-scrollbar-thumb{background:#37301f;border:2px solid #151312}
::-webkit-scrollbar-thumb:hover{background:#4d4227}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.4rem 4rem;position:relative;z-index:6}
.ic{width:1.1em;height:1.1em;flex:none}
.diam{color:var(--gold);display:inline-flex}
.diam .ic{width:.62em;height:.62em}

/* ============ Шапка ============ */
.site-head{display:flex;align-items:center;gap:1.3rem;padding:2.6rem 0 1.4rem}
.emblem{width:58px;height:58px;color:var(--gold-dim);flex:none}
.site-head h1{
  font-family:'Cinzel',serif;font-weight:900;text-transform:uppercase;
  letter-spacing:.2em;font-size:2rem;line-height:1.1;color:var(--ink);
}
.site-head h1::first-letter{color:var(--gold)}
.site-head .sub{
  margin-top:.35rem;font-style:italic;color:var(--ink-dim);font-size:1rem;letter-spacing:.02em;
}
.rule-orn{display:flex;align-items:center;gap:.8rem;margin-bottom:.4rem}
.rule-orn::before,.rule-orn::after{content:'';flex:1;height:1px;background:var(--line)}

/* ============ Вкладки ============ */
.tabs{display:flex;gap:2.6rem;border-bottom:1px solid var(--line);margin-bottom:.4rem}
.tab{
  background:none;border:none;cursor:pointer;position:relative;
  font-family:'Cinzel',serif;font-weight:600;font-size:.92rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);
  padding:.95rem .15rem;transition:color .18s;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--gold)}
.tab.active::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--blood);
  box-shadow:0 1px 0 rgba(201,160,80,.35);
}
.tab-panel{padding-top:1.2rem}

/* ============ Тулбар справочника ============ */
.ref-toolbar{display:flex;gap:1rem;margin:1rem 0 1.8rem;flex-wrap:wrap}
.search-wrap{flex:1;min-width:250px;position:relative}
.search-wrap .ic{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--ink-faint);width:1.15rem;height:1.15rem}
input[type=text],input[type=number],select{
  background:var(--bg-deep);border:1px solid var(--line);color:var(--ink);
  font-family:inherit;font-size:1rem;padding:.58rem .9rem;width:100%;
  transition:border-color .18s, box-shadow .18s;
}
input[type=number]{width:auto}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 1px rgba(201,160,80,.18)}
.search-wrap input{padding-left:2.6rem}
select{cursor:pointer;min-width:210px;width:auto}
select option{background:var(--bg-deep)}

/* ============ Секции справочника ============ */
.cat{margin-bottom:2.6rem}
.cat-head{
  display:flex;align-items:baseline;gap:.85rem;
  border-bottom:1px solid var(--line);padding-bottom:.55rem;margin-bottom:1.15rem;
  position:sticky;top:0;background:var(--bg);z-index:10;
}
.cat-title{font-family:'Cinzel',serif;font-weight:700;font-size:1.32rem;color:var(--gold);letter-spacing:.06em}
.cat-count{margin-left:auto;color:var(--ink-faint);font-size:.88rem;font-style:italic}

/* ============ Карточки-статьи ============ */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.85rem}
.card{
  background:var(--panel);border:1px solid var(--line-soft);position:relative;
  padding:.95rem 1.1rem .85rem;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.35);
  transition:border-color .18s, box-shadow .18s, transform .18s;
}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background .18s}
.card:hover,.card:focus-visible{
  border-color:var(--gold-dim);box-shadow:0 5px 16px rgba(0,0,0,.5);transform:translateY(-1px);outline:none;
}
.card:hover::before,.card:focus-visible::before{background:var(--blood)}
.card-name{
  font-family:'Cinzel',serif;font-weight:700;font-size:1.03rem;letter-spacing:.03em;
  display:flex;align-items:center;gap:.55rem;color:var(--ink);
}
.card-short{color:var(--ink-dim);font-style:italic;font-size:.96rem;margin-top:.4rem}
.card-meta{
  margin-top:.6rem;font-family:'Cinzel',serif;font-size:.7rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
}
.card-meta .tag-good{color:var(--gold)}
.card-meta .tag-bad{color:var(--blood-bright)}
mark{background:none;color:var(--gold);border-bottom:1px solid var(--gold-dim);padding:0}

/* ============ Таблицы ============ */
.table-scroll{overflow-x:auto;border:1px solid var(--line-soft);background:var(--panel);box-shadow:0 2px 6px rgba(0,0,0,.35)}
table{width:100%;border-collapse:collapse;min-width:660px;font-size:.96rem}
th{
  font-family:'Cinzel',serif;font-weight:600;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);text-align:left;padding:.7rem .85rem;white-space:nowrap;
  background:var(--panel-2);border-bottom:1px solid var(--line);
}
td{padding:.55rem .85rem;border-bottom:1px solid var(--line-soft);color:var(--ink-dim);vertical-align:top}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--panel-2)}
tbody tr:hover td{color:var(--ink)}
tbody tr:last-child td{border-bottom:none}
td.rowname{font-family:'Cinzel',serif;font-weight:600;color:var(--ink);font-size:.95rem;letter-spacing:.02em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tnote{color:var(--ink-faint);font-size:.87rem;font-style:italic;margin-top:.6rem}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
.sort-arrow{color:var(--gold);font-size:.75em;margin-left:.3rem}
.armor-group{margin-bottom:1.5rem}
.armor-group h3{font-family:'Cinzel',serif;font-weight:600;font-size:1rem;color:var(--ink);letter-spacing:.06em;margin-bottom:.6rem}

/* ============ Пустые состояния ============ */
.empty{
  border:1px dashed var(--line);padding:2.6rem 1.5rem;text-align:center;
  color:var(--ink-faint);font-style:italic;
}
.empty .diam{display:block;margin:0 auto .8rem;opacity:.7}

/* ============ Трекер: тулбар ============ */
.xp-toolbar{display:flex;gap:1rem;flex-wrap:wrap;align-items:stretch;margin:1rem 0 1.8rem}
.char-form{display:flex;gap:.7rem;flex:1;min-width:270px}
.char-form input{flex:1}
.xp-tools{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

/* ============ Кнопки ============ */
.btn{
  font-family:'Cinzel',serif;font-weight:600;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;
  padding:.55rem 1.05rem;background:transparent;border:1px solid var(--line);color:var(--ink-dim);
  cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap;
  transition:color .18s,border-color .18s,background .18s;
}
.btn:hover{color:var(--ink);border-color:var(--gold-dim)}
.btn.gold{border-color:var(--gold-dim);color:var(--gold)}
.btn.gold:hover{background:rgba(201,160,80,.08);border-color:var(--gold)}
.btn.blood{border-color:#5c2420;color:#cd7166}
.btn.blood:hover{background:rgba(139,0,0,.14);border-color:var(--blood-bright);color:#e08a7e}
.btn.danger{border-color:#5c2420;color:var(--ink-dim)}
.btn.danger:hover{color:var(--blood-bright);border-color:var(--blood-bright)}
.icon-btn{
  background:none;border:1px solid transparent;cursor:pointer;color:var(--ink-faint);
  padding:.45rem;display:inline-flex;transition:color .18s,border-color .18s;
}
.icon-btn:hover{color:var(--blood-bright);border-color:var(--line)}

/* ============ Трекер: персонажи ============ */
.char-list{display:flex;flex-direction:column;gap:.8rem}
.char-row{
  display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line-soft);border-left:3px solid var(--gold-dim);
  padding:.95rem 1.2rem;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:border-color .18s;
}
.char-row:hover{border-left-color:var(--blood)}
.char-name{font-family:'Cinzel',serif;font-weight:700;font-size:1.14rem;letter-spacing:.03em}
.char-xp{margin-left:auto;display:flex;align-items:baseline;gap:.55rem}
.xp-num{font-family:'Cinzel',serif;font-weight:900;font-size:1.9rem;color:var(--gold);min-width:2ch;text-align:center;line-height:1}
.xp-num.neg{color:var(--blood-bright)}
.xp-label{font-style:italic;color:var(--ink-faint);font-size:.9rem}
.char-actions{display:flex;gap:.55rem;align-items:center}

/* ============ Заголовки секций трекера ============ */
.sec-title{
  display:flex;align-items:center;gap:.85rem;font-family:'Cinzel',serif;font-weight:700;
  font-size:1.22rem;letter-spacing:.05em;margin:2.3rem 0 1.1rem;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}
.sec-title .side{margin-left:0;display:flex;gap:.7rem;align-items:center}
.sec-title select{font-size:.9rem;padding:.35rem .6rem}
.log-count{font-family:'EB Garamond',serif;font-weight:400;font-style:italic;font-size:.9rem;color:var(--ink-faint);letter-spacing:0}

/* ============ Лог ============ */
td .sign{font-family:'Cinzel',serif;font-weight:700;font-size:1.05rem;margin-right:.35rem}
td .sign.plus{color:var(--gold)}
td .sign.minus{color:var(--blood-bright)}

/* ============ Модальные окна ============ */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(10,8,6,.78);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:6vh 1rem;overflow-y:auto;
}
.modal{
  background:#1e1b16;border:1px solid var(--gold-dim);outline:1px solid rgba(201,160,80,.22);outline-offset:4px;
  max-width:660px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.75);
  animation:modalIn .22s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:flex-start;gap:1rem;padding:1.25rem 1.5rem .95rem;border-bottom:1px solid var(--line)}
.modal-head h2{font-family:'Cinzel',serif;font-weight:700;font-size:1.28rem;color:var(--gold);letter-spacing:.04em;line-height:1.3;flex:1}
.modal-head .icon-btn{margin:-.2rem -.4rem 0 0}
.modal-body{padding:1.25rem 1.5rem 1.6rem}
.modal-kicker{
  font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:.9rem;
}
.d-desc{font-size:1.08rem;color:var(--ink)}
.d-drop::first-letter{
  font-family:'Cinzel',serif;font-weight:700;font-size:2.7em;color:var(--gold);
  float:left;line-height:.82;padding:.06em .14em 0 0;
}
.d-block{margin-top:1.15rem;border-left:2px solid var(--gold-dim);padding:.15rem 0 .15rem 1rem}
.d-block.bloodline{border-left-color:var(--blood)}
.d-block .lbl{
  font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--gold);display:block;margin-bottom:.35rem;
}
.d-block.bloodline .lbl{color:var(--blood-bright)}
.d-block p{color:var(--ink-dim);font-size:.99rem}
ul.specs{list-style:none;margin-top:.2rem}
ul.specs li{padding:.32rem 0;color:var(--ink-dim);font-size:.99rem;display:flex;gap:.6rem;align-items:baseline}
ul.specs li b{color:var(--ink);font-weight:600;white-space:nowrap}
.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.55rem;margin:1rem 0 .2rem}
.props>div{border:1px solid var(--line-soft);background:var(--bg-deep);padding:.5rem .75rem}
.props dt{font-family:'Cinzel',serif;font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.props dd{font-size:1.06rem;color:var(--ink);margin-top:.12rem}
.lvl{display:flex;gap:1.05rem;padding:.75rem 0;border-bottom:1px dashed var(--line-soft)}
.lvl:last-child{border-bottom:none}
.lvl-num{
  flex:none;width:2.05rem;height:2.05rem;display:grid;place-items:center;margin:.15rem .5rem 0 0;
  border:1px solid var(--gold-dim);transform:rotate(45deg);
  font-family:'Cinzel',serif;font-weight:700;font-size:.8rem;color:var(--gold);
}
.lvl-num span{transform:rotate(-45deg)}
.lvl b{color:var(--ink);font-weight:600}
.lvl p{color:var(--ink-dim);font-size:.97rem;margin-top:.15rem}
.warn{color:var(--blood-bright);font-style:italic;font-size:.93rem;margin-top:.2rem}

/* ============ Формы в модалках ============ */
.field{margin-bottom:1.05rem}
.field label{
  display:block;font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:.4rem;
}
.modal-actions{display:flex;justify-content:flex-end;gap:.7rem;margin-top:1.5rem}
.check{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer;margin-top:1rem;color:var(--ink-dim);font-size:.97rem}
.check input{accent-color:var(--blood);margin-top:.3rem;flex:none}

/* ============ Тосты ============ */
.toasts{position:fixed;bottom:1.2rem;right:1.2rem;display:flex;flex-direction:column;gap:.55rem;z-index:200}
.toast{
  background:#221e18;border:1px solid var(--gold-dim);border-left:3px solid var(--gold);
  padding:.72rem 1.05rem;font-size:.95rem;max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.55);
  animation:toastIn .25s ease;
}
.toast.err{border-color:#5c2420;border-left-color:var(--blood-bright)}
@keyframes toastIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

footer{border-top:1px solid var(--line-soft);margin-top:2.5rem;padding:1.2rem 0 .5rem;text-align:center;color:var(--ink-faint);font-style:italic;font-size:.88rem}

/* ============ Адаптив ============ */
@media (max-width:680px){
  body{font-size:16.5px}
  .site-head{gap:.9rem;padding-top:1.6rem}
  .site-head h1{font-size:1.45rem;letter-spacing:.14em}
  .emblem{width:44px;height:44px}
  .tabs{gap:1.3rem}
  .tab{font-size:.8rem;letter-spacing:.1em}
  .char-xp{margin-left:0;width:100%;order:3}
  .char-actions{margin-left:auto}
  .modal-body,.modal-head{padding-left:1.05rem;padding-right:1.05rem}
}
</style>
</head>
<body>

<div class="wrap">
  <!-- Шапка с эмблемой: меч в ромбе -->
  <header class="site-head">
    <svg class="emblem" viewBox="0 0 64 64" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M32 3 57 32 32 61 7 32Z"/>
        <path d="M32 17v29"/>
        <path d="M23 27h18"/>
      </g>
      <path d="M32 10l4 7h-8z" fill="currentColor"/>
      <circle cx="32" cy="49" r="2" fill="currentColor"/>
    </svg>
    <div>
      <h1>Скиталец</h1>
      <p class="sub">Тёмные времена · настольный помощник мастера и отряда</p>
    </div>
  </header>

  <div class="rule-orn"><span class="diam" data-diamond></span></div>

  <!-- Вкладки -->
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="ref">Справочник</button>
    <button class="tab" data-tab="xp">Трекер опыта</button>
  </nav>

  <!-- ================= Вкладка «Справочник» ================= -->
  <section id="panel-ref" class="tab-panel">
    <div class="ref-toolbar">
      <div class="search-wrap">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><line x1="15" y1="15" x2="20" y2="20"/></svg>
        <input type="text" id="refSearch" placeholder="Поиск по названию и описанию…" autocomplete="off">
      </div>
      <select id="refCat" aria-label="Фильтр по категориям">
        <option value="all">Все категории</option>
      </select>
    </div>
    <div id="refList"></div>
  </section>

  <!-- ================= Вкладка «Трекер опыта» ================= -->
  <section id="panel-xp" class="tab-panel hidden">
    <div class="xp-toolbar">
      <form id="charForm" class="char-form">
        <input type="text" id="charNameInput" placeholder="Имя нового скитальца…" maxlength="40" autocomplete="off">
        <button class="btn gold" type="submit" id="charAddBtn">Принять в отряд</button>
      </form>
      <div class="xp-tools">
        <button class="btn" id="exportBtn">Экспорт JSON</button>
        <button class="btn" id="importBtn">Импорт JSON</button>
        <button class="btn danger" id="resetBtn">Сбросить данные</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </div>

    <h2 class="sec-title"><span class="diam" data-diamond></span>Отряд</h2>
    <div id="charList" class="char-list"></div>

    <h2 class="sec-title">
      <span class="diam" data-diamond></span>Летопись опыта
      <span class="side">
        <span class="log-count" id="logCount"></span>
        <select id="logCharFilter" aria-label="Фильтр летописи по персонажу"></select>
      </span>
    </h2>
    <div id="logWrap"></div>
  </section>

  <footer>Все данные хранятся только в вашем браузере — мастер может спать спокойно.</footer>
</div>

<!-- Модальное окно -->
<div class="overlay hidden" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" id="modalClose" aria-label="Закрыть">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
'use strict';

/* =====================================================================
   ДАННЫЕ ПРАВИЛ — объект gameData
   Короткие ключи: n — название, s — краткое описание, d — полное описание,
   m — игромеханика, sp — специализации [{n, d}], lv — уровни [{lv, n, d}],
   pr — расплата проклятой силы.
   ===================================================================== */
const CAT_META = {
  qualities:{title:'Качества',      kicker:'Качество'},
  skills:   {title:'Навыки',        kicker:'Навык'},
  lore:     {title:'Знания',        kicker:'Знание'},
  virtues:  {title:'Добродетели',   kicker:'Добродетель'},
  powers:   {title:'Проклятые силы',kicker:'Проклятая сила'},
  states:   {title:'Состояния',     kicker:'Состояние'},

const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const escapeReg = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const uid = () => 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* Подсветка совпадений поиска */
function hl(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const re = new RegExp('('+escapeReg(esc(q))+')','gi');
  return safe.replace(re,'<mark>$1</mark>');
}
/* Русские склонения: pluralize(5, ['запись','записи','записей']) */
function pluralize(n, forms){
  const a = Math.abs(n)%100, b = a%10;
  if(a>10 && a<20) return forms[2];
  if(b>1 && b<5)  return forms[1];
  if(b===1)       return forms[0];
  return forms[2];
}
function fmtDate(ts){
  const d = new Date(ts), p = x => String(x).padStart(2,'0');
  return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+', '+p(d.getHours())+':'+p(d.getMinutes());
}

function itemMatches(it, q){
  if(!q) return true;
  let hay = it.n+' '+it.s+' '+it.d;
  if(it.sp) hay += ' '+it.sp.map(s=>s.n+' '+s.d).join(' ');
  if(it.lv) hay += ' '+it.lv.map(l=>l.n+' '+l.d).join(' ');
  if(it.k)  hay += ' '+it.k;
  return hay.toLowerCase().includes(q);
}

function sectionHead(key, count){
  const m = CAT_META[key];
  return '<div class="cat-head">'+
    '<span class="diam">'+icon('diamond')+'</span>'+
    '<h2 class="cat-title">'+esc(m.title)+'</h2>'+
    '<span class="cat-count">'+count+' '+pluralize(count,['позиция','позиции','позиций'])+'</span>'+
  '</div>';
}

function cardHTML(it, key, q){
  let meta = '';
  if(it.sp) meta = it.sp.length+' '+pluralize(it.sp.length,['специализация','специализации','специализаций']);
  if(it.lv) meta = 'уровни I–IV · есть расплата';
  if(key==='traits'){
    const good = it.k==='Достоинство';
    meta = '<span class="'+(good?'tag-good':'tag-bad')+'">'+esc(it.k)+
      (good ? ' · '+esc(it.c)+' опыта' : ' · даёт '+esc(it.c)+' опыта')+'</span>';
  }
  return '<article class="card" role="button" tabindex="0" data-cat="'+key+'" data-item="'+it.id+'">'+
    '<h3 class="card-name"><span class="diam">'+icon('diamond')+'</span>'+hl(it.n, q)+'</h3>'+
    '<p class="card-short">'+hl(it.s, q)+'</p>'+
    (meta ? '<p class="card-meta">'+meta+'</p>' : '')+
  '</article>';
}

function renderReference(){
  const q = refState.q.toLowerCase();
  const cats = refState.cat==='all' ? CAT_ORDER : [refState.cat];
  let html = '', found = 0;

  for(const key of cats){
    const sec = gameData[key];
    if(key==='weapons'){
      const items = sec.filter(w=>itemMatches(w,q));
      if(q && !items.length) continue;
      found += items.length;
      html += '<section class="cat">'+sectionHead(key,items.length)+weaponsTableHTML(items,q)+'</section>';
    }else if(key==='armor'){
      const groups = sec.map(g=>({name:g.name, rows:g.rows.filter(r=>itemMatches(r,q))}))
                        .filter(g=>!q || g.rows.length);
      const count = groups.reduce((s,g)=>s+g.rows.length,0);
      if(q && !count) continue;
      found += count;
      html += '<section class="cat">'+sectionHead(key,count)+armorTablesHTML(groups,q)+'</section>';
    }else{
      const items = sec.filter(it=>itemMatches(it,q));
      if(q && !items.length) continue;
      found += items.length;
      html += '<section class="cat">'+sectionHead(key,items.length)+
        '<div class="cards">'+items.map(it=>cardHTML(it,key,q)).join('')+'</div></section>';
    }
  }
  if(!found && q){
    html = '<div class="empty"><span class="diam">'+icon('diamond')+'</span>По запросу «'+esc(refState.q)+'» ничего не найдено.<br>Попробуйте иное слово — летопись тёмных времён обширна.</div>';
  }
  $('#refList').innerHTML = html;
}

}

 $('#charList').addEventListener('click', e=>{
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const c = state.characters.find(x=>x.id===btn.dataset.id);
  if(!c) return;
  if(btn.dataset.act==='add')  openXpModal(c, 'add');
  if(btn.dataset.act==='spend')openXpModal(c, 'spend');
  if(btn.dataset.act==='del')  openDeleteCharModal(c);
});

/* --- Окно добавления/траты опыта --- */
function openXpModal(c, mode){
  const isAdd = mode==='add';
  openModal((isAdd?'Добавить опыт · ':'Потратить опыт · ')+esc(c.name),
    '<form id="xpForm">'+
      '<div class="field"><label>Количество</label><input type="number" id="xpAmount" min="1" step="1" value="1"></div>'+
      '<div class="field"><label>Причина</label><input type="text" id="xpReason" maxlength="120" placeholder="'+
        (isAdd?'подвиг, найденный клад, урок мастера…':'обучение, снаряжение, услуга…')+'"></div>'+
      '<p class="warn hidden" id="xpWarn">Внимание: опыт уйдёт в минус. Мастер вольно распоряжается судьбой, но подумайте ещё раз.</p>'+
      '<div class="modal-actions">'+
        '<button type="button" class="btn" id="xpCancel">Отмена</button>'+
        '<button type="submit" class="btn '+(isAdd?'gold':'blood')+'">'+(isAdd?'Записать прибавку':'Записать трату')+'</button>'+
      '</div>'+
    '</form>');
  const amountEl = $('#xpAmount');
  const warnEl = $('#xpWarn');
  amountEl.addEventListener('input', ()=>{
    const v = parseInt(amountEl.value,10)||0;
    warnEl.classList.toggle('hidden', isAdd || (c.xp - v) >= 0);
  });
  $('#xpCancel').addEventListener('click', closeModal);
  $('#xpForm').addEventListener('submit', e=>{
    e.preventDefault();
    const amount = parseInt(amountEl.value,10);
    if(!amount || amount<1){ toast('Укажите количество больше нуля', false); return; }
    const reason = $('#xpReason').value.trim() || 'Без причины';
    c.xp += isAdd ? amount : -amount;
    state.log.push({ id:uid(), ts:Date.now(), charId:c.id, charName:c.name,
                     type:isAdd?'+':'−', amount, reason });
    saveState(); closeModal(); renderTracker();
    toast((isAdd?'+':'−')+amount+' · '+c.name+' — «'+reason+'»');
  });
  amountEl.focus(); amountEl.select();
}

/* --- Удаление персонажа с опцией чистки летописи --- */
function openDeleteCharModal(c){
  const n = state.log.filter(l=>l.charId===c.id).length;
  const entryWord = pluralize(n,['запись','записи','записей']);
  confirmModal({
    title:'Удалить скитальца?',
    body:'«'+esc(c.name)+'» покинет отряд'+(n ? ' — в летописи останется '+n+' '+entryWord+' о нём.' : '.')+
      '<label class="check"><input type="checkbox" id="delLogEntries" checked> Удалить также его '+n+' '+entryWord+' из летописи</label>',
    confirmText:'Удалить',
    onConfirm(){
      state.characters = state.characters.filter(x=>x.id!==c.id);
      if($('#delLogEntries') && $('#delLogEntries').checked){
        state.log = state.log.filter(l=>l.charId!==c.id);
      }
      saveState(); renderTracker();
      toast('«'+c.name+'» покинул отряд');
    }
  });
}

/* --- Летопись: фильтр, сортировка, рендер --- */
 $('#logCharFilter').addEventListener('change', e=>{ logCharFilter = e.target.value; renderLog(); });
 $('#logWrap').addEventListener('click', e=>{
  const th = e.target.closest('th[data-sort]');
  if(!th) return;
  const key = th.dataset.sort;
  if(logSort.key===key) logSort.dir *= -1;
  else logSort = { key, dir: key==='ts' ? -1 : 1 };
  renderLog();
});

function renderLog(){
  /* Фильтр по персонажу */
  const sel = $('#logCharFilter');
  const current = state.characters.some(c=>c.id===logCharFilter) ? logCharFilter : 'all';
  sel.innerHTML = '<option value="all">Все скитальцы</option>'+
    state.characters.map(c=>'<option value="'+c.id+'"'+(c.id===current?' selected':'')+'>'+esc(c.name)+'</option>').join('');
  logCharFilter = current;

  $('#logCount').textContent = state.log.length
    ? state.log.length+' '+pluralize(state.log.length,['запись','записи','записей']) : '';

  let rows = state.log.filter(l=> logCharFilter==='all' || l.charId===logCharFilter);
  rows = rows.slice().sort((a,b)=>{
    if(logSort.key==='ts') return (a.ts-b.ts)*logSort.dir;
    return a.charName.localeCompare(b.charName,'ru')*logSort.dir;
  });

  const arrow = k => logSort.key===k ? '<span class="sort-arrow">'+(logSort.dir===1?'▴':'▾')+'</span>' : '';

  if(!rows.length){
    $('#logWrap').innerHTML = '<div class="empty"><span class="diam">'+icon('diamond')+'</span>Летопись пока чиста. Каждый прибывший и потраченный опыт будет записан сюда.</div>';
    return;
  }
  $('#logWrap').innerHTML = '<div class="table-scroll"><table><thead><tr>'+
    '<th class="sortable" data-sort="ts">Дата'+arrow('ts')+'</th>'+
    '<th class="sortable" data-sort="name">Персонаж'+arrow('name')+'</th>'+
    '<th>Тип</th><th class="num">Кол-во</th><th>Причина</th>'+
    '</tr></thead><tbody>'+
    rows.map(l=>
      '<tr><td style="white-space:nowrap">'+fmtDate(l.ts)+'</td>'+
      '<td>'+esc(l.charName)+'</td>'+
      '<td><span class="sign '+(l.type==='+'?'plus':'minus')+'">'+l.type+'</span>'+(l.type==='+'?'получение':'трата')+'</td>'+
      '<td class="num">'+l.amount+'</td>'+
      '<td>'+esc(l.reason)+'</td></tr>').join('')+
    '</tbody></table></div>';
}

/* =====================================================================
   ЭКСПОРТ / ИМПОРТ / СБРОС
   ===================================================================== */
 $('#exportBtn').addEventListener('click', ()=>{
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'skitalets-save-'+stamp+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Данные сохранены в файл skitalets-save-'+stamp+'.json');
});

 $('#importBtn').addEventListener('click', ()=> $('#importFile').click());
 $('#importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(err){ toast('Файл повреждён: это не корректный JSON', false); return; }
    if(!data || !Array.isArray(data.characters) || !Array.isArray(data.log)){
      toast('Структура файла не похожа на сохранение Скитальца', false); return;
    }
    const nC = data.characters.length, nL = data.log.length;
    confirmModal({
      title:'Заменить данные?',
      body:'Из файла будут восстановлены <b>'+nC+'</b> '+pluralize(nC,['скиталец','скитальца','скитальцев'])+
           ' и <b>'+nL+'</b> '+pluralize(nL,['запись','записи','записей'])+' летописи. Текущие данные будут заменены.',
      confirmText:'Заменить',
      onConfirm(){
        state = data; saveState(); renderTracker();
        toast('Данные успешно загружены из файла');
      }
    });
  };
  reader.onerror = ()=> toast('Не удалось прочитать файл', false);
  reader.readAsText(file);
});

 $('#resetBtn').addEventListener('click', ()=>{
  confirmModal({
    title:'Сбросить все данные?',
    body:'Весь отряд и вся летопись будут <b>безвозвратно удалены</b> из памяти браузера. Перед сбросом можно сделать экспорт в JSON.',
    confirmText:'Стереть всё',
    onConfirm(){
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      state = { characters:[], log:[] };
      logCharFilter = 'all';
      renderTracker();
      toast('Все данные стёрты. Начинается новая история');
    }
  });
});

/* =====================================================================
   ИНИЦИАЛИЗАЦИЯ
   ===================================================================== */
loadState();
renderReference();
renderTracker();
</script>
